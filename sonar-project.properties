# ═══════════════════════════════════════════════════════════════════════════════
# SonarQube Configuration — ResumeAI Microservices
# ═══════════════════════════════════════════════════════════════════════════════
# Run: sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<YOUR_TOKEN>

sonar.projectKey=resumeai-microservices
sonar.projectName=ResumeAI Microservices
sonar.projectVersion=1.0.0

# ── Source Directories (Multi-Module) ────────────────────────────────────────
sonar.sources=\
  auth-service/src/main/java,\
  ai-service/src/main/java,\
  api-gateway/src/main/java,\
  eureka-server/src/main/java,\
  export-service/src/main/java,\
  jobmatch-service/src/main/java,\
  notification-service/src/main/java,\
  resume-service/src/main/java,\
  section-service/src/main/java,\
  template-service/src/main/java

# ── Test Directories ─────────────────────────────────────────────────────────
sonar.tests=\
  auth-service/src/test/java,\
  ai-service/src/test/java,\
  api-gateway/src/test/java,\
  export-service/src/test/java,\
  jobmatch-service/src/test/java,\
  notification-service/src/test/java,\
  resume-service/src/test/java,\
  section-service/src/test/java,\
  template-service/src/test/java

# ── Java Configuration ───────────────────────────────────────────────────────
sonar.java.source=17
sonar.java.target=17
sonar.sourceEncoding=UTF-8
sonar.language=java

# ── Java Binaries (compiled classes for deeper analysis) ─────────────────────
sonar.java.binaries=\
  auth-service/target/classes,\
  ai-service/target/classes,\
  api-gateway/target/classes,\
  eureka-server/target/classes,\
  export-service/target/classes,\
  jobmatch-service/target/classes,\
  notification-service/target/classes,\
  resume-service/target/classes,\
  section-service/target/classes,\
  template-service/target/classes

# ── Coverage Reports (JaCoCo) ───────────────────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=\
  auth-service/target/site/jacoco/jacoco.xml,\
  ai-service/target/site/jacoco/jacoco.xml,\
  api-gateway/target/site/jacoco/jacoco.xml,\
  export-service/target/site/jacoco/jacoco.xml,\
  jobmatch-service/target/site/jacoco/jacoco.xml,\
  notification-service/target/site/jacoco/jacoco.xml,\
  resume-service/target/site/jacoco/jacoco.xml,\
  section-service/target/site/jacoco/jacoco.xml,\
  template-service/target/site/jacoco/jacoco.xml

# ── Exclusions ───────────────────────────────────────────────────────────────
# Exclude auto-generated code, configs, and non-business files
sonar.exclusions=\
  **/target/**,\
  **/.mvn/**,\
  **/.idea/**,\
  **/.vscode/**,\
  **/*.xml,\
  **/*.md,\
  **/*.sql,\
  **/*.txt,\
  **/*.json,\
  **/*.zip,\
  **/*.pdf,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/largefile.pdf,\
  **/dummy.txt,\
  **/java_pids.txt,\
  **/java_processes.txt,\
  **/jcmd.txt,\
  **/all_templates.txt,\
  **/templates.json,\
  **/templates_utf8.json,\
  **/auth-service.zip

# Exclude test files from duplication analysis
sonar.cpd.exclusions=**/test/**,**/dto/**,**/entity/**

# ── Quality Gate ─────────────────────────────────────────────────────────────
# Target: 0 Critical, 0 Blocker, Maintainability A, Security A, Reliability A
sonar.qualitygate.wait=true
