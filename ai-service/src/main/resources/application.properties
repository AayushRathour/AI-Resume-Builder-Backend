server.port=8085

spring.application.name=ai-service

# API prefix — must align with gateway route /api/ai/**
server.servlet.context-path=/api

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:7509}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}

## NVIDIA NIM (set via environment)
# NVIDIA_API_KEY=your_key_here

# Avoid lazy DB loading from web view rendering
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Quota limits
ai.quota.free.monthly-calls=5
ai.quota.free.monthly-ats=3

# Actuator
management.endpoints.web.exposure.include=health,info

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Exchange / routing key (must match notification-service RabbitMQConfig)
rabbitmq.exchange=notification.exchange
rabbitmq.routing-key.ai=ai.completed


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.tomcat.max-swallow-size=-1
