server.port=8080

spring.application.name=api-gateway

# Eureka
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5

# spring.cloud.gateway.server.webmvc Routes
# Auth service does not use server.servlet.context-path=/api.
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=2

# Services below use server.servlet.context-path=/api.
spring.cloud.gateway.server.webmvc.routes[1].id=resume-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://resume-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/resumes/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[1].filters[1]=PrefixPath=/api

spring.cloud.gateway.server.webmvc.routes[2].id=section-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://section-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/sections/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[2].filters[1]=PrefixPath=/api

spring.cloud.gateway.server.webmvc.routes[3].id=template-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://template-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/templates/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[3].filters[1]=PrefixPath=/api

spring.cloud.gateway.server.webmvc.routes[4].id=ai-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://ai-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/ai/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[4].filters[1]=PrefixPath=/api

spring.cloud.gateway.server.webmvc.routes[5].id=export-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://export-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/export/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[5].filters[1]=PrefixPath=/api

spring.cloud.gateway.server.webmvc.routes[6].id=jobmatch-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://JOBMATCH-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/jobmatch/**
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[6].filters[1]=PrefixPath=/api

spring.cloud.gateway.server.webmvc.routes[7].id=notification-service
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[7].filters[1]=PrefixPath=/api

# WebSocket endpoint (notification-service — SockJS/STOMP)
spring.cloud.gateway.server.webmvc.routes[16].id=notification-ws
spring.cloud.gateway.server.webmvc.routes[16].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[16].predicates[0]=Path=/ws-notifications/**
spring.cloud.gateway.server.webmvc.routes[16].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Backward-compatible aliases for older frontend paths.
spring.cloud.gateway.server.webmvc.routes[8].id=export-service-legacy
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://export-service
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/v1/exports/**
spring.cloud.gateway.server.webmvc.routes[8].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[8].filters[1]=PrefixPath=/api

spring.cloud.gateway.server.webmvc.routes[9].id=jobmatch-service-legacy
spring.cloud.gateway.server.webmvc.routes[9].uri=lb://JOBMATCH-SERVICE
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/v1/job-matches/**
spring.cloud.gateway.server.webmvc.routes[9].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[9].filters[1]=PrefixPath=/api

# OAuth passthrough to auth-service
# These must NOT be JWT-protected — the gateway JwtAuthFilter already skips /oauth2/ and /login/oauth2/
spring.cloud.gateway.server.webmvc.routes[10].id=auth-service-oauth
spring.cloud.gateway.server.webmvc.routes[10].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/oauth2/**

spring.cloud.gateway.server.webmvc.routes[11].id=auth-service-login-oauth
spring.cloud.gateway.server.webmvc.routes[11].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[11].predicates[0]=Path=/login/**

# Required singular resume route support
spring.cloud.gateway.server.webmvc.routes[12].id=resume-service-singular
spring.cloud.gateway.server.webmvc.routes[12].uri=lb://resume-service
spring.cloud.gateway.server.webmvc.routes[12].predicates[0]=Path=/api/v1/resume/**
spring.cloud.gateway.server.webmvc.routes[12].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[12].filters[1]=PrefixPath=/api

# Admin template APIs (template-service)
spring.cloud.gateway.server.webmvc.routes[13].id=template-service-admin
spring.cloud.gateway.server.webmvc.routes[13].uri=lb://template-service
spring.cloud.gateway.server.webmvc.routes[13].predicates[0]=Path=/api/v1/admin/templates/**
spring.cloud.gateway.server.webmvc.routes[13].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[13].filters[1]=PrefixPath=/api

# Admin APIs (auth-service)
spring.cloud.gateway.server.webmvc.routes[14].id=auth-service-admin
spring.cloud.gateway.server.webmvc.routes[14].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[14].predicates[0]=Path=/api/v1/admin/**
spring.cloud.gateway.server.webmvc.routes[14].filters[0]=StripPrefix=2

# Payment APIs (auth-service)
spring.cloud.gateway.server.webmvc.routes[15].id=auth-service-payment
spring.cloud.gateway.server.webmvc.routes[15].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[15].predicates[0]=Path=/api/v1/payment/**
spring.cloud.gateway.server.webmvc.routes[15].filters[0]=StripPrefix=2

# JWT secret MUST be identical to auth-service JWT_SECRET — tokens signed on 8081 are validated here
jwt.secret=${JWT_SECRET:resumeai_auth_service_secret_key_2026_secure}
app.auth-service.base-url=${APP_AUTH_SERVICE_BASE_URL:http://localhost:8081}
app.auth-service.fallback-base-urls=${APP_AUTH_SERVICE_FALLBACK_BASE_URLS:http://auth-service}

# Frontend CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Global CORS is handled by CorsConfig.java FilterRegistrationBean

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger Aggregation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/api/v1/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=Resume Service
springdoc.swagger-ui.urls[1].url=/api/v1/resumes/v3/api-docs
springdoc.swagger-ui.urls[2].name=Section Service
springdoc.swagger-ui.urls[2].url=/api/v1/sections/v3/api-docs
springdoc.swagger-ui.urls[3].name=Template Service
springdoc.swagger-ui.urls[3].url=/api/v1/templates/v3/api-docs
springdoc.swagger-ui.urls[4].name=AI Service
springdoc.swagger-ui.urls[4].url=/api/v1/ai/v3/api-docs
springdoc.swagger-ui.urls[5].name=Export Service
springdoc.swagger-ui.urls[5].url=/api/v1/export/v3/api-docs
springdoc.swagger-ui.urls[6].name=JobMatch Service
springdoc.swagger-ui.urls[6].url=/api/v1/jobmatch/v3/api-docs
springdoc.swagger-ui.urls[7].name=Notification Service
springdoc.swagger-ui.urls[7].url=/api/v1/notifications/v3/api-docs

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=120000
spring.mvc.async.request-timeout=120000
