server.port=8087

spring.application.name=JOBMATCH-SERVICE

# API prefix — must align with gateway route /api/jobs/**
server.servlet.context-path=/api

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobmatch_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:7509}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Eureka
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Feign / Inter-service URLs (fallback if Eureka is not available)
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
services.resume.base-url=${RESUME_SERVICE_BASE_URL:http://localhost:8082}
services.section.base-url=${SECTION_SERVICE_BASE_URL:http://localhost:8083}
services.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8085}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Exchange / routing key (must match notification-service RabbitMQConfig)
rabbitmq.exchange=notification.exchange
rabbitmq.routing-key.job=job.match


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cache (local in-memory to run without Docker dependencies)
spring.cache.type=simple

# NVIDIA NIM is called via ai-service

# Adzuna API (Primary job search API)
adzuna.app.id=${ADZUNA_APP_ID:bc48dc28}
adzuna.app.key=${ADZUNA_APP_KEY:5ce9ed62d4226f784186e845504e98c4}

# TheirStack API (Fallback job search API)
theirstack.api.url=https://api.theirstack.com/v1/jobs/search
theirstack.api.key=${THEIRSTACK_API_KEY:}

# API rate limiting
app.ratelimit.analyze-per-minute=${APP_RATE_LIMIT_ANALYZE_PER_MINUTE:20}
app.ratelimit.jobs-per-minute=${APP_RATE_LIMIT_JOBS_PER_MINUTE:60}

