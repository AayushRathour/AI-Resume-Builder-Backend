spring.config.import=optional:file:.env[.properties]

server.port=8087

spring.application.name=JOBMATCH-SERVICE

# API prefix --- must align with gateway route /api/jobs/**
server.servlet.context-path=/api

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/jobmatch_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Eureka
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_SERVER_URL:http://localhost:8761/eureka/}}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Feign / Inter-service URLs (fallback if Eureka is not available)
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=60000
feign.client.config.ai-service.connectTimeout=10000
feign.client.config.ai-service.readTimeout=180000
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=60000
spring.cloud.openfeign.client.config.default.loggerLevel=basic
spring.cloud.openfeign.client.config.default.retryer=feign.Retryer$Default
# OpenFeign circuit breaker
spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.resume-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.resume-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.resume-service.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.section-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.section-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.section-service.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.ai-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ai-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.ai-service.waitDurationInOpenState=30s

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- RabbitMQ ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}

# Exchange / routing key (standardized --- must match notification-service RabbitMQConfig)
rabbitmq.exchange=resumeai.exchange
rabbitmq.routing-key.job=ats.completed


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Upload limits for resume analysis (PDF from local upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cache (local in-memory to run without Docker dependencies)
spring.cache.type=simple

# NVIDIA NIM is called via ai-service

# Adzuna API (Primary job search API)
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}

# TheirStack API (Fallback job search API)
theirstack.api.url=https://api.theirstack.com/v1/jobs/search
theirstack.api.key=${THEIRSTACK_API_KEY:}

# API rate limiting
app.ratelimit.analyze-per-minute=${APP_RATE_LIMIT_ANALYZE_PER_MINUTE:20}
app.ratelimit.jobs-per-minute=${APP_RATE_LIMIT_JOBS_PER_MINUTE:60}
