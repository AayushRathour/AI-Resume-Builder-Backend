spring.config.import=optional:file:.env[.properties]

server.port=8086

spring.application.name=export-service

# Force MVC servlet runtime --- webflux is on classpath only for WebClient
spring.main.web-application-type=servlet

# --- RabbitMQ is optional --- export works without notifications ---
spring.rabbitmq.connection-timeout=5000

# --- MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/export_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- RabbitMQ ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:guest}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}

# Exchange / routing key (standardized --- must match notification-service RabbitMQConfig)
rabbitmq.exchange=resumeai.exchange
rabbitmq.routing-key.export=resume.exported

# --- Eureka ---
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_SERVER_URL:http://localhost:8761/eureka/}}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

# --- Feign + Resilience4j ---
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=30000
spring.cloud.openfeign.client.config.default.loggerLevel=basic
spring.cloud.openfeign.client.config.default.retryer=feign.Retryer$Default

resilience4j.circuitbreaker.instances.resume-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.resume-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.resume-service.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.section-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.section-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.section-service.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.template-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.template-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.template-service.waitDurationInOpenState=20s

# --- PDF output directory ---
export.output-dir=${EXPORT_OUTPUT_DIR:${user.home}/ResumeAI/exports}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
