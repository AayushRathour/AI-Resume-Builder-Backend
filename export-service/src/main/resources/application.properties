server.port=8086

spring.application.name=export-service

# Force MVC servlet runtime — webflux is on classpath only for WebClient
spring.main.web-application-type=servlet

# ── RabbitMQ is optional — export works without notifications ─────────────
spring.rabbitmq.connection-timeout=5000

# ── MySQL ─────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/export_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:7509}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Exchange / routing key (must match notification-service RabbitMQConfig)
rabbitmq.exchange=notification.exchange
rabbitmq.routing-key.export=export.completed

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

# ── Service URLs (local defaults; can be overridden for discovery) ───────────
service.resume.url=${SERVICE_RESUME_URL:http://localhost:8082}
service.section.url=${SERVICE_SECTION_URL:http://localhost:8083}
service.template.url=${SERVICE_TEMPLATE_URL:http://localhost:8084}

# ── PDF output directory ──────────────────────────────────────────────────────
export.output-dir=${EXPORT_OUTPUT_DIR:./exports}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
