spring.config.import=optional:file:.env[.properties]

server.port=8082

spring.application.name=resume-service

# API prefix — must align with gateway route /api/resumes/**
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ─── RabbitMQ ────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Exchange / routing key (standardized — must match notification-service RabbitMQConfig)
rabbitmq.exchange=resumeai.exchange
rabbitmq.routing-key.resume=resume.created

# Eureka discovery configuration
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}

# ── Feign + Resilience4j ───────────────────────────────────────────────
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=20000
spring.cloud.openfeign.client.config.default.loggerLevel=basic
spring.cloud.openfeign.client.config.default.retryer=feign.Retryer$Default

resilience4j.circuitbreaker.instances.section-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.section-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.section-service.waitDurationInOpenState=20s

# AI configuration (Google Gemini)
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.api.key=${GEMINI_API_KEY:}

# Frontend integration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
