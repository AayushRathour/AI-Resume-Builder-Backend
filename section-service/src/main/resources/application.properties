spring.config.import=optional:file:.env[.properties]

server.port=8083

spring.application.name=section-service

# API prefix --- must align with gateway route /api/sections/**
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/section_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Enable SQL initialization for non-destructive schema compatibility migration
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}

# --- Feign + Resilience4j ---
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=20000
spring.cloud.openfeign.client.config.default.loggerLevel=basic
spring.cloud.openfeign.client.config.default.retryer=feign.Retryer$Default

resilience4j.circuitbreaker.instances.resume-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.resume-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.resume-service.waitDurationInOpenState=20s


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
