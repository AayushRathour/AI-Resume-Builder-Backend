spring.config.import=optional:file:.env[.properties]

spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:7509}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.devtools.restart.enabled=false

# Eureka
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

# JWT (minimum 32+ chars for HS256)
jwt.secret=${JWT_SECRET:resumeai_auth_service_secret_key_2026_secure}
jwt.expiration=86400000

# Google OAuth2 placeholders
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id_here}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Frontend CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.oauth2.success-redirect-url=${APP_OAUTH2_SUCCESS_REDIRECT_URL:${app.frontend-base-url}/oauth/callback}
app.oauth2.failure-redirect-url=${APP_OAUTH2_FAILURE_REDIRECT_URL:${app.frontend-base-url}/login}

# Downstream services for admin APIs
app.template-service.base-url=${APP_TEMPLATE_SERVICE_BASE_URL:http://localhost:8084/api/templates}
app.ai-service.base-url=${APP_AI_SERVICE_BASE_URL:http://localhost:8085/api/ai}
app.resume-service.base-url=${APP_RESUME_SERVICE_BASE_URL:http://localhost:8082/api/resumes}

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_Sidxk33TqVlq1d}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:LrjLmz70jU1FbRA6uPI906S2}

# Actuator (needed for Eureka health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Debug security decisions (temporary)
logging.level.org.springframework.security=DEBUG

server.error.include-message=always
server.error.include-stacktrace=always
