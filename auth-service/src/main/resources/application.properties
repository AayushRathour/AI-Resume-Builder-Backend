spring.config.import=optional:file:.env[.properties]

spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:7509}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.devtools.restart.enabled=false

# Eureka
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Exchange / routing key (must match notification-service RabbitMQConfig)
rabbitmq.exchange=notification.exchange
rabbitmq.routing-key.auth=auth.signup

# JWT (minimum 32+ chars for HS256)
jwt.secret=${JWT_SECRET:resumeai_auth_service_secret_key_2026_secure}
jwt.expiration=86400000

# Google OAuth2 placeholders
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id_here}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Frontend CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.oauth2.success-redirect-url=${APP_OAUTH2_SUCCESS_REDIRECT_URL:${app.frontend-base-url}/oauth/callback}
app.oauth2.failure-redirect-url=${APP_OAUTH2_FAILURE_REDIRECT_URL:${app.frontend-base-url}/login}

# Default admin bootstrap
app.admin.enabled=${APP_ADMIN_ENABLED:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@resumeai.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}
app.admin.full-name=${APP_ADMIN_FULL_NAME:ResumeAI Admin}

# Feign + Resilience4j for internal service communication
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=30000
spring.cloud.openfeign.client.config.default.loggerLevel=basic
spring.cloud.openfeign.client.config.default.retryer=feign.Retryer$Default
resilience4j.circuitbreaker.instances.template-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.template-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.template-service.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.ai-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ai-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.ai-service.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.resume-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.resume-service.slidingWindowSize=20
resilience4j.circuitbreaker.instances.resume-service.waitDurationInOpenState=20s

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Actuator (needed for Eureka health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Debug security decisions (temporary)
logging.level.org.springframework.security=INFO

server.error.include-message=always
server.error.include-stacktrace=never
